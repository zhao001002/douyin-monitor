name: Douyin history export

on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: "最多抓取页数（默认 100）"
        required: false
        default: "100"
        type: string
      max_items:
        description: "最多导出作品数（默认 5000）"
        required: false
        default: "5000"
        type: string

permissions:
  contents: write

concurrency:
  # Share the monitor lock so a history commit cannot race with a state commit.
  group: douyin-monitor
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOUYIN_USER_URL: ${{ vars.DOUYIN_USER_URL }}
      DOUYIN_COOKIE: ${{ secrets.DOUYIN_COOKIE }}
      DOUYIN_HISTORY_MAX_PAGES: ${{ inputs.max_pages }}
      DOUYIN_HISTORY_MAX_ITEMS: ${{ inputs.max_items }}
      PUBLISHED_TIMEZONE: ${{ vars.PUBLISHED_TIMEZONE }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: douyin/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r douyin/requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Export historical works
        run: python douyin/monitor.py --export-history --output-dir douyin/history

      - name: Upload export artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: douyin-history
          path: |
            douyin/history/history.csv
            douyin/history/history.json
          if-no-files-found: error
          retention-days: 30

      - name: Persist historical export
        if: success()
        shell: bash
        run: |
          if ! git status --porcelain -- douyin/history/history.csv douyin/history/history.json | grep -q .; then
            echo "No history changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- douyin/history/history.csv douyin/history/history.json
          git commit -m "data: export Douyin creator history"
          git push origin "HEAD:${GITHUB_REF_NAME}"
